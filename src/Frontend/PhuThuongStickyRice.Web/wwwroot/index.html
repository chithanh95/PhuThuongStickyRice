    <script>
        // Theme (dark mode): apply saved choice before first paint to avoid flash.
        (function () {
            try {
                if (localStorage.getItem('pt-theme') === 'dark') {
                    document.documentElement.classList.add('dark');
                }
            } catch (e) { }
        })();
        window.ptGetTheme = function (key) {
            key = key || 'pt-theme';
            try { return localStorage.getItem(key) === 'dark' ? 'dark' : 'light'; }
            catch (e) { return 'light'; }
        };
        window.ptToggleTheme = function (key) {
            key = key || 'pt-theme';
            var dark = !document.documentElement.classList.contains('dark');
            document.documentElement.classList.toggle('dark', dark);
            try { localStorage.setItem(key, dark ? 'dark' : 'light'); } catch (e) { }
            return dark ? 'dark' : 'light';
        };
        window.ptApplyTheme = function (key) {
            key = key || 'pt-theme';
            try {
                var dark = localStorage.getItem(key) === 'dark';
                document.documentElement.classList.toggle('dark', dark);
            } catch (e) { }
        };
    </script>
