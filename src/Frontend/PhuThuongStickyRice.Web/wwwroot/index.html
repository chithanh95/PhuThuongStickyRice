    <script>
        // Theme (dark mode): apply saved choice before first paint to avoid flash.
        (function () {
            try {
                if (localStorage.getItem('pt-theme') === 'dark') {
                    document.documentElement.classList.add('dark');
                }
            } catch (e) { }
        })();
        window.ptGetTheme = function (key) {
            key = key || 'pt-theme';
            try {
                var v = localStorage.getItem(key);
                if (v === 'auto') return 'auto';
                return v === 'dark' ? 'dark' : 'light';
            }
            catch (e) { return 'light'; }
        };
        window.ptResolveAutoTheme = function () {
            // Tự động: 18:00–06:00 → dark, còn lại → light (giờ địa phương).
            var h = new Date().getHours();
            return (h >= 18 || h < 6) ? 'dark' : 'light';
        };
        window.ptToggleTheme = function (key) {
            key = key || 'pt-theme';
            // Chuyển vòng: light → dark → auto → light
            var cur = 'light';
            try { cur = localStorage.getItem(key) || 'light'; } catch (e) { }
            var next = cur === 'light' ? 'dark' : (cur === 'dark' ? 'auto' : 'light');
            try { localStorage.setItem(key, next); } catch (e) { }
            window.ptApplyTheme(key);
            return next;
        };
        window.ptApplyTheme = function (key) {
            key = key || 'pt-theme';
            try {
                var v = localStorage.getItem(key);
                var dark = v === 'dark' || (v === 'auto' && window.ptResolveAutoTheme() === 'dark');
                document.documentElement.classList.toggle('dark', dark);
            } catch (e) { }
        };
        // Chữ lớn cho người lớn tuổi (#196).
        window.ptGetLargeText = function () {
            try { return localStorage.getItem('pt-large-text') === '1'; }
            catch (e) { return false; }
        };
        window.ptToggleLargeText = function () {
            var on = !document.documentElement.classList.contains('large-text');
            document.documentElement.classList.toggle('large-text', on);
            try { localStorage.setItem('pt-large-text', on ? '1' : '0'); } catch (e) { }
            return on;
        };
        window.ptApplyLargeText = function () {
            try {
                var on = localStorage.getItem('pt-large-text') === '1';
                document.documentElement.classList.toggle('large-text', on);
            } catch (e) { }
        };
        // Áp dụng chữ lớn ngay trước khi vẽ để tránh nhấp nháy.
        (function () {
            try {
                if (localStorage.getItem('pt-large-text') === '1') {
                    document.documentElement.classList.add('large-text');
                }
            } catch (e) { }
        })();
    </script>
