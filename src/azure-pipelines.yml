# PhuThuongStickyRice — CI: restore, build Release and run tests for the whole solution.
# https://docs.microsoft.com/azure/devops/pipelines/languages/dotnet-core

trigger:
  branches:
    include:
    - main
  paths:
    include:
    - src
    - tests

resources:
- repo: self

variables:
  solution: 'src/PhuThuongStickyRice.sln'
  buildConfiguration: 'Release'
  # Agent VM image name
  vmImageName: 'ubuntu-latest'

stages:
- stage: DotNetBuild
  displayName: .NET Build & Test
  jobs:
  - job: Build
    displayName: Build and Test
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: UseDotNet@2
      displayName: Use .NET 10 SDK
      inputs:
        packageType: 'sdk'
        version: '10.0.x'
    - task: DotNetCoreCLI@2
      displayName: dotnet restore
      inputs:
        command: 'restore'
        projects: '$(solution)'
    - task: DotNetCoreCLI@2
      displayName: dotnet build
      inputs:
        command: 'build'
        projects: '$(solution)'
        arguments: '--configuration $(buildConfiguration) --no-restore'
    - task: DotNetCoreCLI@2
      displayName: dotnet test
      inputs:
        command: 'test'
        projects: |
          tests/PhuThuongStickyRice.ArchTests/*.csproj
          tests/PhuThuongStickyRice.ContractTests/*.csproj
          tests/PhuThuongStickyRice.IntegrationTests/*.csproj
          tests/PhuThuongStickyRice.UnitTests/*.csproj
        arguments: '--configuration $(buildConfiguration) --no-build'
